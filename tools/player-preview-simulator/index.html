<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Preview Simulator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: var(--bg-color); color: var(--text-color); }
        h2 { color: var(--text-color); margin-bottom: 15px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .controls select, .controls input { padding: 8px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); border-radius: 5px; }
        .preview-container { border: 2px solid var(--border-color); border-radius: 8px; background-color: #000; position: relative; margin: 20px auto; }
        .preview-screen { width: 100%; height: 100%; background: linear-gradient(45deg, #1a1a1a 25%, transparent 25%), linear-gradient(-45deg, #1a1a1a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1a1a1a 75%), linear-gradient(-45deg, transparent 75%, #1a1a1a 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; display: flex; align-items: center; justify-content: center; color: #666; font-size: 1.2em; position: relative; overflow: hidden; }
        .media-content { max-width: 100%; max-height: 100%; object-fit: contain; }
        .overlay-info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 3px; font-size: 0.8em; }
        .aspect-ratio-16-9 { aspect-ratio: 16/9; }
        .aspect-ratio-9-16 { aspect-ratio: 9/16; }
        .aspect-ratio-4-3 { aspect-ratio: 4/3; }
        .aspect-ratio-1-1 { aspect-ratio: 1/1; }
    </style>
</head>
<body>
    <h2>Player Preview Simulator 📺</h2>
    <p>Simulate how your media will appear on different digital signage player configurations.</p>
    
    <div class="controls">
        <select id="aspect-ratio">
            <option value="16-9">16:9 (Landscape)</option>
            <option value="9-16">9:16 (Portrait)</option>
            <option value="4-3">4:3 (Traditional)</option>
            <option value="1-1">1:1 (Square)</option>
        </select>
        <select id="resolution">
            <option value="1920x1080">1920x1080 (Full HD)</option>
            <option value="1366x768">1366x768 (HD)</option>
            <option value="3840x2160">3840x2160 (4K)</option>
            <option value="1080x1920">1080x1920 (Portrait HD)</option>
        </select>
        <input type="file" id="media-input" accept="image/*,video/*">
        <input type="color" id="bg-color" value="#000000" title="Background Color">
    </div>
    
    <div class="preview-container aspect-ratio-16-9" id="preview-container">
        <div class="preview-screen" id="preview-screen">
            <div>📺 Drop media here or use file input above</div>
            <div class="overlay-info" id="overlay-info">1920x1080 • 16:9</div>
        </div>
    </div>

    <script>
        const aspectRatioSelect = document.getElementById('aspect-ratio');
        const resolutionSelect = document.getElementById('resolution');
        const mediaInput = document.getElementById('media-input');
        const bgColorInput = document.getElementById('bg-color');
        const previewContainer = document.getElementById('preview-container');
        const previewScreen = document.getElementById('preview-screen');
        const overlayInfo = document.getElementById('overlay-info');
        let currentToolId = '';

        function saveState() {
            if (currentToolId) {
                const state = {
                    aspectRatio: aspectRatioSelect.value,
                    resolution: resolutionSelect.value,
                    bgColor: bgColorInput.value,
                    // Note: Cannot save File objects directly to localStorage.
                    // If media persistence is critical, you'd need to save the file to IndexedDB
                    // or re-prompt the user to select it. For now, media will not persist.
                };
                localStorage.setItem(`tool-state-${currentToolId}`, JSON.stringify(state));
            }
        }

        function loadState() {
            if (currentToolId) {
                const savedState = localStorage.getItem(`tool-state-${currentToolId}`);
                if (savedState) {
                    const state = JSON.parse(savedState);
                    aspectRatioSelect.value = state.aspectRatio || '16-9';
                    resolutionSelect.value = state.resolution || '1920x1080';
                    bgColorInput.value = state.bgColor || '#000000';
                    updatePreview();
                }
            }
        }

        function updatePreview() {
            const aspectRatio = aspectRatioSelect.value;
            const resolution = resolutionSelect.value;
            const bgColor = bgColorInput.value;

            // Update aspect ratio class
            previewContainer.className = `preview-container aspect-ratio-${aspectRatio}`;
            
            // Update background color
            previewScreen.style.backgroundColor = bgColor;
            
            // Update overlay info
            overlayInfo.textContent = `${resolution} • ${aspectRatio.replace('-', ':')}`;
            saveState(); // Save state on preview update
        }

        aspectRatioSelect.addEventListener('change', updatePreview);
        resolutionSelect.addEventListener('change', updatePreview);
        bgColorInput.addEventListener('change', updatePreview);

        mediaInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            const isVideo = file.type.startsWith('video/');
            
            previewScreen.innerHTML = `
                <${isVideo ? 'video' : 'img'} 
                    class="media-content" 
                    src="${url}" 
                    ${isVideo ? 'controls autoplay muted loop' : ''}
                    alt="Preview content">
                <div class="overlay-info" id="overlay-info">${resolutionSelect.value} • ${aspectRatioSelect.value.replace('-', ':')}</div>
            `;
            // Note: Media content itself is not saved to localStorage.
            // The user would need to re-upload the file on session restore.
        });

        // Drag and drop support
        previewScreen.addEventListener('dragover', (e) => {
            e.preventDefault();
            previewScreen.style.borderColor = 'var(--button-bg)';
        });

        previewScreen.addEventListener('dragleave', () => {
            previewScreen.style.borderColor = 'var(--border-color)';
        });

        previewScreen.addEventListener('drop', (e) => {
            e.preventDefault();
            previewScreen.style.borderColor = 'var(--border-color)';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                mediaInput.files = files;
                mediaInput.dispatchEvent(new Event('change'));
            }
        });

        // Apply theme and receive toolId from parent
        window.addEventListener('message', (event) => {
            if (event.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme', event.data.theme);
            } else if (event.data.type === 'toolId') {
                currentToolId = event.data.toolId;
                loadState(); // Load state once toolId is received
            }
        });
        // Request initial theme and toolId on load
        window.parent.postMessage({ type: 'requestTheme' }, '*');
        window.parent.postMessage({ type: 'requestToolId' }, '*');
    </script>
</body>
</html>
