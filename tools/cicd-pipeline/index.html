<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Pipeline Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { 
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .header h1 { 
            color: #2c3e50; 
            margin-bottom: 10px;
            font-size: 2rem;
            font-weight: 700;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        .btn { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
        }
        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-success { 
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white; 
        }
        .btn-warning { 
            background: linear-gradient(135deg, #fdbb2d 0%, #22c1c3 100%);
            color: white; 
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card { 
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
        }
        .card:hover { 
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(31, 38, 135, 0.5);
        }
        .card h3 { 
            color: #2c3e50; 
            margin-bottom: 15px;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .pipeline-list { max-height: 400px; overflow-y: auto; }
        .pipeline-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }
        .pipeline-item:hover { background: rgba(255, 255, 255, 0.8); }
        .pipeline-item.active { border-left-color: #4CAF50; }
        .pipeline-item.inactive { border-left-color: #f44336; }
        .pipeline-info h4 { 
            margin-bottom: 5px;
            color: #2c3e50;
            font-size: 1rem;
        }
        .pipeline-info p { 
            color: #7f8c8d;
            font-size: 0.9rem;
            margin: 2px 0;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-success { background: #e8f5e8; color: #2e7d32; }
        .status-running { background: #e3f2fd; color: #1976d2; }
        .status-failed { background: #ffebee; color: #c62828; }
        .status-pending { background: #fff3e0; color: #f57c00; }
        .run-list { max-height: 300px; overflow-y: auto; }
        .run-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .metric-item {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .metric-item:hover { background: rgba(255, 255, 255, 0.5); }
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            display: block;
        }
        .metric-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 5px;
        }
        .stage-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .stage-item {
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-left: 4px solid transparent;
        }
        .stage-item.success { border-left-color: #4CAF50; }
        .stage-item.running { border-left-color: #2196F3; }
        .stage-item.failed { border-left-color: #f44336; }
        .stage-item.pending { border-left-color: #ff9800; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ CI/CD Pipeline Manager</h1>
            <p>Continuous integration and deployment pipeline management</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="createPipeline()">
                ➕ Create Pipeline
            </button>
            <button class="btn btn-success" onclick="triggerBuild()">
                ▶️ Trigger Build
            </button>
            <button class="btn btn-warning" onclick="viewMetrics()">
                📊 View Metrics
            </button>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>🔧 Active Pipelines</h3>
                <div class="pipeline-list" id="pipelineList">
                    <!-- Pipelines will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>🏃 Recent Runs</h3>
                <div class="run-list" id="runList">
                    <!-- Recent runs will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>📊 Pipeline Metrics</h3>
                <div class="metrics-grid" id="metricsGrid">
                    <!-- Metrics will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>🔄 Current Build</h3>
                <div id="currentBuild">
                    <p style="text-align: center; color: #7f8c8d; padding: 20px;">No active builds</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let developmentService;
        let pipelines = [];
        let recentRuns = [];
        let currentMetrics = {};

        async function initializeCICDManager() {
            try {
                if (window.parent && window.parent.signageDebugServices) {
                    developmentService = window.parent.signageDebugServices.professionalDevelopment;
                    await loadDashboard();
                    startRealTimeUpdates();
                } else {
                    showError('Professional Development service not available');
                }
            } catch (error) {
                console.error('Failed to initialize CI/CD manager:', error);
                showError('Failed to initialize CI/CD manager');
            }
        }

        async function loadDashboard() {
            await Promise.all([
                loadPipelines(),
                loadRecentRuns(),
                loadMetrics()
            ]);
        }

        async function loadPipelines() {
            try {
                pipelines = await developmentService.getPipelines();
                renderPipelines();
            } catch (error) {
                console.error('Failed to load pipelines:', error);
            }
        }

        async function loadRecentRuns() {
            try {
                if (pipelines.length > 0) {
                    const allRuns = [];
                    for (const pipeline of pipelines) {
                        const runs = await developmentService.getPipelineRuns(pipeline.id);
                        allRuns.push(...runs.slice(0, 3)); // Get recent 3 runs per pipeline
                    }
                    recentRuns = allRuns.sort((a, b) => new Date(b.startedAt).getTime() - new Date(a.startedAt).getTime()).slice(0, 10);
                }
                renderRecentRuns();
            } catch (error) {
                console.error('Failed to load recent runs:', error);
            }
        }

        async function loadMetrics() {
            try {
                currentMetrics = await developmentService.getDevelopmentMetrics();
                renderMetrics();
            } catch (error) {
                console.error('Failed to load metrics:', error);
            }
        }

        function renderPipelines() {
            const container = document.getElementById('pipelineList');
            
            if (pipelines.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 20px;">No pipelines configured</p>';
                return;
            }

            container.innerHTML = pipelines.map(pipeline => `
                <div class="pipeline-item ${pipeline.status}">
                    <div class="pipeline-info">
                        <h4>${pipeline.name}</h4>
                        <p>Repository: ${pipeline.repository.url.split('/').pop()}</p>
                        <p>Branch: ${pipeline.repository.branch}</p>
                        <p>Success Rate: ${pipeline.metrics.successRate.toFixed(1)}%</p>
                        <p>Total Runs: ${pipeline.metrics.totalRuns}</p>
                    </div>
                    <div>
                        <div class="status-badge status-${pipeline.status === 'active' ? 'success' : 'failed'}">
                            ${pipeline.status.toUpperCase()}
                        </div>
                        <button class="btn btn-success" onclick="triggerPipeline('${pipeline.id}')" style="margin-top: 10px; font-size: 12px; padding: 8px 12px;">
                            ▶️ Run
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderRecentRuns() {
            const container = document.getElementById('runList');
            
            if (recentRuns.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 20px;">No recent runs</p>';
                return;
            }

            container.innerHTML = recentRuns.map(run => {
                const pipeline = pipelines.find(p => p.id === run.pipelineId);
                const duration = run.duration ? Math.round(run.duration / 1000) : 0;
                
                return `
                    <div class="run-item">
                        <div>
                            <h5>${pipeline?.name || 'Unknown Pipeline'} #${run.number}</h5>
                            <p>Status: ${run.status} | Duration: ${duration}s</p>
                            <p>Started: ${new Date(run.startedAt).toLocaleString()}</p>
                        </div>
                        <div class="status-badge status-${run.status}">
                            ${run.status.toUpperCase()}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMetrics() {
            const container = document.getElementById('metricsGrid');
            const overview = currentMetrics.overview || {};
            
            container.innerHTML = `
                <div class="metric-item">
                    <span class="metric-value">${overview.totalPipelines || 0}</span>
                    <div class="metric-label">Total Pipelines</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${overview.activePipelines || 0}</span>
                    <div class="metric-label">Active Pipelines</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${Math.round(overview.successRate || 0)}%</span>
                    <div class="metric-label">Success Rate</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${Math.round(overview.averageDuration || 0)}s</span>
                    <div class="metric-label">Avg Duration</div>
                </div>
            `;
        }

        async function createPipeline() {
            const name = prompt('Enter pipeline name:');
            if (!name) return;

            const repo = prompt('Enter repository URL:');
            if (!repo) return;

            try {
                const pipelineData = {
                    name: name,
                    description: `Pipeline for ${name}`,
                    repository: {
                        url: repo,
                        branch: 'main',
                        provider: 'github',
                        webhooks: []
                    },
                    triggers: [{
                        id: 'trigger_001',
                        type: 'push',
                        conditions: [{ type: 'branch', pattern: 'main', exclude: false }],
                        enabled: true
                    }],
                    stages: [{
                        id: 'build_stage',
                        name: 'Build',
                        type: 'build',
                        dependencies: [],
                        parallel: false,
                        steps: [{
                            id: 'build_step',
                            name: 'Build Application',
                            type: 'script',
                            command: 'npm run build',
                            continueOnError: false,
                            timeout: 600,
                            environment: {}
                        }],
                        environment: {},
                        timeout: 900,
                        retryPolicy: {
                            maxAttempts: 2,
                            backoff: 'linear',
                            delay: 30,
                            condition: 'on_failure'
                        },
                        artifacts: [],
                        conditions: []
                    }],
                    environment: {
                        variables: {},
                        secrets: {}
                    },
                    status: 'active',
                    configuration: {
                        notifications: [],
                        integrations: [],
                        security: {
                            scanTypes: [],
                            thresholds: {},
                            blockOnCritical: false,
                            reportFormat: []
                        },
                        quality: {
                            codeQuality: { enabled: false, tools: [], thresholds: {}, failOnViolation: false },
                            testing: { unit: false, integration: false, e2e: false, performance: false, parallel: false, reportFormat: [] },
                            coverage: { enabled: false, threshold: 0, reportFormat: [], excludePatterns: [] }
                        },
                        deployment: {
                            strategy: 'rolling',
                            environments: [],
                            approvals: [],
                            rollback: { enabled: true, automatic: false, conditions: [], strategy: 'previous_version' }
                        }
                    }
                };

                await developmentService.createPipeline(pipelineData);
                showSuccess('Pipeline created successfully');
                await loadDashboard();
            } catch (error) {
                console.error('Failed to create pipeline:', error);
                showError('Failed to create pipeline');
            }
        }

        async function triggerBuild() {
            if (pipelines.length === 0) {
                showError('No pipelines available to trigger');
                return;
            }

            const pipelineNames = pipelines.map((p, i) => `${i}: ${p.name}`).join('\n');
            const selection = prompt(`Select pipeline to trigger:\n${pipelineNames}\n\nEnter number:`);
            
            if (selection === null) return;
            
            const index = parseInt(selection);
            if (isNaN(index) || index < 0 || index >= pipelines.length) {
                showError('Invalid selection');
                return;
            }

            await triggerPipeline(pipelines[index].id);
        }

        async function triggerPipeline(pipelineId) {
            try {
                const trigger = {
                    type: 'manual',
                    user: 'admin',
                    timestamp: new Date().toISOString()
                };

                const run = await developmentService.triggerPipeline(pipelineId, trigger);
                showSuccess(`Pipeline triggered successfully. Run #${run.number} started.`);
                
                // Show current build
                showCurrentBuild(run);
                
                // Refresh dashboard after delay
                setTimeout(() => loadDashboard(), 3000);
            } catch (error) {
                console.error('Failed to trigger pipeline:', error);
                showError('Failed to trigger pipeline');
            }
        }

        function showCurrentBuild(run) {
            const container = document.getElementById('currentBuild');
            const pipeline = pipelines.find(p => p.id === run.pipelineId);
            
            container.innerHTML = `
                <h4>${pipeline?.name || 'Unknown Pipeline'} #${run.number}</h4>
                <p>Status: ${run.status}</p>
                <p>Started: ${new Date(run.startedAt).toLocaleString()}</p>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${run.status === 'running' ? '50' : run.status === 'success' ? '100' : '0'}%"></div>
                </div>
                <div class="stage-list">
                    ${run.stages.map(stage => `
                        <div class="stage-item ${stage.status}">
                            <strong>Stage:</strong> ${pipeline?.stages.find(s => s.id === stage.stageId)?.name || stage.stageId}
                            <br><strong>Status:</strong> ${stage.status}
                            ${stage.duration ? `<br><strong>Duration:</strong> ${Math.round(stage.duration / 1000)}s` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function viewMetrics() {
            const overview = currentMetrics.overview || {};
            const automation = currentMetrics.automation || {};
            
            showInfo(`CI/CD Metrics:\n\nPipelines:\n- Total: ${overview.totalPipelines || 0}\n- Active: ${overview.activePipelines || 0}\n- Success Rate: ${Math.round(overview.successRate || 0)}%\n- Avg Duration: ${Math.round(overview.averageDuration || 0)}s\n\nAutomation:\n- Total Automations: ${automation.totalAutomations || 0}\n- Active: ${automation.activeAutomations || 0}\n- Total Executions: ${automation.totalExecutions || 0}`);
        }

        function startRealTimeUpdates() {
            setInterval(async () => {
                await loadRecentRuns();
                await loadMetrics();
            }, 30000); // Update every 30 seconds
        }

        function showSuccess(message) {
            alert('✅ ' + message);
        }

        function showError(message) {
            alert('❌ ' + message);
        }

        function showInfo(message) {
            alert('ℹ️ ' + message);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeCICDManager);
    </script>
</body>
</html>
