<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Workspace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { 
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .header h1 { 
            color: #2c3e50; 
            margin-bottom: 10px;
            font-size: 2rem;
            font-weight: 700;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        .btn { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
        }
        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-success { 
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white; 
        }
        .btn-warning { 
            background: linear-gradient(135deg, #fdbb2d 0%, #22c1c3 100%);
            color: white; 
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card { 
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
        }
        .card:hover { 
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(31, 38, 135, 0.5);
        }
        .card h3 { 
            color: #2c3e50; 
            margin-bottom: 15px;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .workspace-list { max-height: 400px; overflow-y: auto; }
        .workspace-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }
        .workspace-item:hover { background: rgba(255, 255, 255, 0.8); }
        .workspace-item.active { border-left-color: #4CAF50; }
        .workspace-item.inactive { border-left-color: #f44336; }
        .workspace-info h4 { 
            margin-bottom: 5px;
            color: #2c3e50;
            font-size: 1rem;
        }
        .workspace-info p { 
            color: #7f8c8d;
            font-size: 0.9rem;
            margin: 2px 0;
        }
        .plugin-list { max-height: 300px; overflow-y: auto; }
        .plugin-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        .plugin-item:hover { background: rgba(255, 255, 255, 0.5); }
        .plugin-info h5 { 
            margin-bottom: 3px;
            color: #2c3e50;
            font-size: 0.9rem;
        }
        .plugin-info p { 
            color: #7f8c8d;
            font-size: 0.8rem;
        }
        .rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
        }
        .stars {
            color: #ffc107;
            font-size: 0.8rem;
        }
        .project-list { max-height: 300px; overflow-y: auto; }
        .project-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .project-item:hover { background: rgba(255, 255, 255, 0.5); }
        .project-info h5 { 
            margin-bottom: 5px;
            color: #2c3e50;
            font-size: 0.9rem;
        }
        .project-info p { 
            color: #7f8c8d;
            font-size: 0.8rem;
            margin: 2px 0;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .setting-item {
            padding: 15px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            text-align: center;
        }
        .setting-item h5 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #667eea;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        .close:hover { color: #333; }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💻 Developer Workspace</h1>
            <p>Personalized development environment and IDE integration</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="createWorkspace()">
                ➕ Create Workspace
            </button>
            <button class="btn btn-success" onclick="browsePlugins()">
                🔌 Browse Plugins
            </button>
            <button class="btn btn-warning" onclick="syncSettings()">
                🔄 Sync Settings
            </button>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>🏠 My Workspaces</h3>
                <div class="workspace-list" id="workspaceList">
                    <!-- Workspaces will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>🔌 Installed Plugins</h3>
                <div class="plugin-list" id="pluginList">
                    <!-- Plugins will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>📁 Recent Projects</h3>
                <div class="project-list" id="projectList">
                    <!-- Projects will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>⚙️ Workspace Settings</h3>
                <div class="settings-grid" id="settingsGrid">
                    <!-- Settings will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Create Workspace Modal -->
    <div id="workspaceModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('workspaceModal')">&times;</span>
            <h3>Create New Workspace</h3>
            <div class="form-group">
                <label>Workspace Name:</label>
                <input type="text" id="workspaceName" placeholder="e.g., Signage Development">
            </div>
            <div class="form-group">
                <label>Description:</label>
                <textarea id="workspaceDescription" rows="3" placeholder="Describe your workspace..."></textarea>
            </div>
            <div class="form-group">
                <label>IDE:</label>
                <select id="workspaceIDE">
                    <option value="vscode">Visual Studio Code</option>
                    <option value="intellij">IntelliJ IDEA</option>
                    <option value="eclipse">Eclipse</option>
                    <option value="vim">Vim</option>
                    <option value="sublime">Sublime Text</option>
                </select>
            </div>
            <div class="form-group">
                <label>Theme:</label>
                <select id="workspaceTheme">
                    <option value="Dark">Dark</option>
                    <option value="Light">Light</option>
                    <option value="High Contrast">High Contrast</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="submitWorkspace()">Create Workspace</button>
        </div>
    </div>

    <script>
        let developmentService;
        let workspaces = [];
        let plugins = [];
        let currentUser = 'developer@company.com';

        async function initializeDeveloperWorkspace() {
            try {
                if (window.parent && window.parent.signageDebugServices) {
                    developmentService = window.parent.signageDebugServices.professionalDevelopment;
                    await loadDashboard();
                } else {
                    showError('Professional Development service not available');
                }
            } catch (error) {
                console.error('Failed to initialize developer workspace:', error);
                showError('Failed to initialize developer workspace');
            }
        }

        async function loadDashboard() {
            await Promise.all([
                loadWorkspaces(),
                loadPlugins(),
                loadProjects(),
                loadSettings()
            ]);
        }

        async function loadWorkspaces() {
            try {
                workspaces = await developmentService.getWorkspaces(currentUser);
                renderWorkspaces();
            } catch (error) {
                console.error('Failed to load workspaces:', error);
            }
        }

        async function loadPlugins() {
            try {
                plugins = await developmentService.getPlugins();
                renderPlugins();
            } catch (error) {
                console.error('Failed to load plugins:', error);
            }
        }

        async function loadProjects() {
            try {
                // Mock project data since we don't have a specific projects endpoint
                const mockProjects = [
                    {
                        id: 'proj_001',
                        name: 'Signage Player App',
                        path: '/workspace/signage-player',
                        type: 'android',
                        lastOpened: new Date(Date.now() - 3600000).toISOString(),
                        buildSystem: 'gradle'
                    },
                    {
                        id: 'proj_002',
                        name: 'Content Management Web',
                        path: '/workspace/cms-web',
                        type: 'web',
                        lastOpened: new Date(Date.now() - 7200000).toISOString(),
                        buildSystem: 'npm'
                    },
                    {
                        id: 'proj_003',
                        name: 'Debug Tools Library',
                        path: '/workspace/debug-lib',
                        type: 'library',
                        lastOpened: new Date(Date.now() - 86400000).toISOString(),
                        buildSystem: 'gradle'
                    }
                ];
                renderProjects(mockProjects);
            } catch (error) {
                console.error('Failed to load projects:', error);
            }
        }

        async function loadSettings() {
            try {
                renderSettings();
            } catch (error) {
                console.error('Failed to load settings:', error);
            }
        }

        function renderWorkspaces() {
            const container = document.getElementById('workspaceList');
            
            if (workspaces.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 20px;">No workspaces created</p>';
                return;
            }

            container.innerHTML = workspaces.map(workspace => `
                <div class="workspace-item ${workspace.isActive ? 'active' : 'inactive'}">
                    <div class="workspace-info">
                        <h4>${workspace.name}</h4>
                        <p>IDE: ${workspace.configuration.ide}</p>
                        <p>Theme: ${workspace.configuration.theme}</p>
                        <p>Projects: ${workspace.projects.length}</p>
                        <p>Last Active: ${new Date(workspace.lastActive).toLocaleDateString()}</p>
                    </div>
                    <div>
                        <button class="btn btn-success" onclick="openWorkspace('${workspace.id}')" style="font-size: 12px; padding: 8px 12px;">
                            🚀 Open
                        </button>
                        <button class="btn btn-warning" onclick="configureWorkspace('${workspace.id}')" style="margin-top: 5px; font-size: 12px; padding: 8px 12px;">
                            ⚙️ Configure
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderPlugins() {
            const container = document.getElementById('pluginList');
            
            if (plugins.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 20px;">No plugins installed</p>';
                return;
            }

            container.innerHTML = plugins.slice(0, 5).map(plugin => `
                <div class="plugin-item">
                    <div class="plugin-info">
                        <h5>${plugin.name}</h5>
                        <p>Version: ${plugin.version} | IDE: ${plugin.ide}</p>
                        <p>${plugin.description}</p>
                        <div class="rating">
                            <span class="stars">${'★'.repeat(Math.floor(plugin.rating))}${'☆'.repeat(5 - Math.floor(plugin.rating))}</span>
                            <span style="font-size: 0.8rem; color: #7f8c8d;">(${plugin.rating})</span>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-primary" onclick="configurePlugin('${plugin.id}')" style="font-size: 12px; padding: 6px 12px;">
                            ⚙️ Configure
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderProjects(projects) {
            const container = document.getElementById('projectList');
            
            if (projects.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 20px;">No recent projects</p>';
                return;
            }

            container.innerHTML = projects.map(project => `
                <div class="project-item" onclick="openProject('${project.id}')">
                    <div class="project-info">
                        <h5>${project.name}</h5>
                        <p>Type: ${project.type.charAt(0).toUpperCase() + project.type.slice(1)}</p>
                        <p>Build System: ${project.buildSystem}</p>
                        <p>Path: ${project.path}</p>
                        <p>Last Opened: ${new Date(project.lastOpened).toLocaleDateString()}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderSettings() {
            const container = document.getElementById('settingsGrid');
            
            container.innerHTML = `
                <div class="setting-item">
                    <h5>Auto Save</h5>
                    <label class="toggle-switch">
                        <input type="checkbox" checked onchange="toggleSetting('autoSave', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <h5>Auto Sync</h5>
                    <label class="toggle-switch">
                        <input type="checkbox" checked onchange="toggleSetting('autoSync', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <h5>Backup Enabled</h5>
                    <label class="toggle-switch">
                        <input type="checkbox" checked onchange="toggleSetting('backupEnabled', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <h5>Collaboration</h5>
                    <label class="toggle-switch">
                        <input type="checkbox" onchange="toggleSetting('collaborationEnabled', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            `;
        }

        function createWorkspace() {
            document.getElementById('workspaceModal').style.display = 'block';
        }

        async function submitWorkspace() {
            try {
                const workspaceData = {
                    name: document.getElementById('workspaceName').value,
                    description: document.getElementById('workspaceDescription').value,
                    userId: currentUser,
                    configuration: {
                        ide: document.getElementById('workspaceIDE').value,
                        extensions: [],
                        theme: document.getElementById('workspaceTheme').value,
                        keymap: 'default',
                        language: 'en',
                        debuggerConfig: {
                            breakpoints: [],
                            watchExpressions: [],
                            stepInto: true,
                            stepOver: true,
                            autoAttach: false,
                            sourceMapping: true
                        },
                        linter: {
                            enabled: true,
                            rules: {},
                            ignorePatterns: ['node_modules/**'],
                            autoFix: false
                        },
                        formatter: {
                            enabled: true,
                            onSave: true,
                            indentSize: 2,
                            indentType: 'spaces',
                            maxLineLength: 120
                        }
                    },
                    tools: [],
                    projects: [],
                    settings: {
                        autoSave: true,
                        autoSync: true,
                        backupEnabled: true,
                        collaborationEnabled: false,
                        plugins: []
                    }
                };

                await developmentService.createWorkspace(workspaceData);
                closeModal('workspaceModal');
                showSuccess('Workspace created successfully');
                await loadWorkspaces();
            } catch (error) {
                console.error('Failed to create workspace:', error);
                showError('Failed to create workspace');
            }
        }

        function openWorkspace(workspaceId) {
            const workspace = workspaces.find(w => w.id === workspaceId);
            if (workspace) {
                showSuccess(`Opening workspace: ${workspace.name}\nIDE: ${workspace.configuration.ide}\nProjects: ${workspace.projects.length}`);
            }
        }

        function configureWorkspace(workspaceId) {
            const workspace = workspaces.find(w => w.id === workspaceId);
            if (workspace) {
                showInfo(`Workspace Configuration: ${workspace.name}\n\nIDE: ${workspace.configuration.ide}\nTheme: ${workspace.configuration.theme}\nKeymap: ${workspace.configuration.keymap}\nLanguage: ${workspace.configuration.language}\n\nDebugger:\n- Auto Attach: ${workspace.configuration.debuggerConfig.autoAttach}\n- Source Mapping: ${workspace.configuration.debuggerConfig.sourceMapping}\n\nLinter:\n- Enabled: ${workspace.configuration.linter.enabled}\n- Auto Fix: ${workspace.configuration.linter.autoFix}\n\nFormatter:\n- On Save: ${workspace.configuration.formatter.onSave}\n- Indent: ${workspace.configuration.formatter.indentSize} ${workspace.configuration.formatter.indentType}`);
            }
        }

        async function browsePlugins() {
            try {
                const allPlugins = await developmentService.getPlugins();
                const pluginList = allPlugins.map(plugin => 
                    `${plugin.name} v${plugin.version} (${plugin.ide}) - ${plugin.rating}★ - ${plugin.downloads} downloads`
                ).join('\n');
                
                showInfo(`Available Plugins:\n\n${pluginList}\n\nUse the "Configure" button next to installed plugins to manage their settings.`);
            } catch (error) {
                console.error('Failed to browse plugins:', error);
                showError('Failed to browse plugins');
            }
        }

        function configurePlugin(pluginId) {
            const plugin = plugins.find(p => p.id === pluginId);
            if (plugin) {
                const features = plugin.features.map(f => `- ${f.name}: ${f.enabled ? 'Enabled' : 'Disabled'}`).join('\n');
                showInfo(`Plugin Configuration: ${plugin.name}\n\nVersion: ${plugin.version}\nIDE: ${plugin.ide}\nRating: ${plugin.rating}/5\nDownloads: ${plugin.downloads}\n\nFeatures:\n${features}\n\nSettings:\n- ADB Path: ${plugin.configuration.settings.adbPath || 'Not set'}\n- Auto Start Logcat: ${plugin.configuration.settings.autoStartLogcat || false}\n- Default Device: ${plugin.configuration.settings.defaultDevice || 'auto'}`);
            }
        }

        function openProject(projectId) {
            showSuccess(`Opening project: ${projectId}\nThis would typically launch your configured IDE with the project loaded.`);
        }

        function toggleSetting(settingName, enabled) {
            showSuccess(`${settingName} ${enabled ? 'enabled' : 'disabled'}`);
        }

        function syncSettings() {
            showInfo('Syncing workspace settings across all devices...\n\nThis includes:\n- IDE configurations\n- Plugin settings\n- Theme preferences\n- Keybindings\n- Project configurations\n\nSync completed successfully!');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function showSuccess(message) {
            alert('✅ ' + message);
        }

        function showError(message) {
            alert('❌ ' + message);
        }

        function showInfo(message) {
            alert('ℹ️ ' + message);
        }

        // Close modals when clicking outside
        window.onclick = function(event) {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeDeveloperWorkspace);
    </script>
</body>
</html>
