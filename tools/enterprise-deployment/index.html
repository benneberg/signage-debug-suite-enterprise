<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Deployment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { 
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .header h1 { 
            color: #2c3e50; 
            margin-bottom: 10px;
            font-size: 2rem;
            font-weight: 700;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        .btn { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
        }
        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-success { 
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white; 
        }
        .btn-warning { 
            background: linear-gradient(135deg, #fdbb2d 0%, #22c1c3 100%);
            color: white; 
        }
        .btn-danger { 
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white; 
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card { 
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
        }
        .card:hover { 
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(31, 38, 135, 0.5);
        }
        .card h3 { 
            color: #2c3e50; 
            margin-bottom: 15px;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .environment-list { max-height: 400px; overflow-y: auto; }
        .environment-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }
        .environment-item:hover { background: rgba(255, 255, 255, 0.8); }
        .environment-item.active { border-left-color: #4CAF50; }
        .environment-item.inactive { border-left-color: #f44336; }
        .environment-item.maintenance { border-left-color: #ff9800; }
        .environment-info h4 { 
            margin-bottom: 5px;
            color: #2c3e50;
            font-size: 1rem;
        }
        .environment-info p { 
            color: #7f8c8d;
            font-size: 0.9rem;
            margin: 2px 0;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-active { background: #e8f5e8; color: #2e7d32; }
        .status-inactive { background: #ffebee; color: #c62828; }
        .status-maintenance { background: #fff3e0; color: #f57c00; }
        .status-error { background: #ffebee; color: #c62828; }
        .deployment-list { max-height: 300px; overflow-y: auto; }
        .deployment-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .metric-item {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .metric-item:hover { background: rgba(255, 255, 255, 0.5); }
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            display: block;
        }
        .metric-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 5px;
        }
        .health-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .health-excellent { background: #4CAF50; }
        .health-good { background: #8BC34A; }
        .health-warning { background: #FF9800; }
        .health-critical { background: #F44336; }
        .pipeline-stages {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .stage-item {
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-left: 4px solid transparent;
            font-size: 0.9rem;
        }
        .stage-item.pending { border-left-color: #9E9E9E; }
        .stage-item.running { border-left-color: #2196F3; }
        .stage-item.success { border-left-color: #4CAF50; }
        .stage-item.failed { border-left-color: #F44336; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏢 Enterprise Deployment</h1>
            <p>Multi-environment deployment orchestration and management</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="createEnvironment()">
                ➕ Create Environment
            </button>
            <button class="btn btn-success" onclick="deployToEnvironment()">
                🚀 Deploy
            </button>
            <button class="btn btn-warning" onclick="viewMetrics()">
                📊 View Metrics
            </button>
            <button class="btn btn-danger" onclick="rollbackDeployment()">
                ↩️ Rollback
            </button>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>🌍 Environments</h3>
                <div class="environment-list" id="environmentList">
                    <!-- Environments will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>🚀 Recent Deployments</h3>
                <div class="deployment-list" id="deploymentList">
                    <!-- Recent deployments will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>📊 Deployment Metrics</h3>
                <div class="metrics-grid" id="metricsGrid">
                    <!-- Metrics will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>🔄 Active Pipeline</h3>
                <div id="activePipeline">
                    <p style="text-align: center; color: #7f8c8d; padding: 20px;">No active deployments</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let deploymentService;
        let environments = [];
        let recentDeployments = [];
        let currentMetrics = {};

        async function initializeEnterpriseDeployment() {
            try {
                if (window.parent && window.parent.signageDebugServices) {
                    deploymentService = window.parent.signageDebugServices.enterpriseDeployment;
                    await loadDashboard();
                    startRealTimeUpdates();
                } else {
                    showError('Enterprise Deployment service not available');
                }
            } catch (error) {
                console.error('Failed to initialize enterprise deployment:', error);
                showError('Failed to initialize enterprise deployment');
            }
        }

        async function loadDashboard() {
            await Promise.all([
                loadEnvironments(),
                loadRecentDeployments(),
                loadMetrics()
            ]);
        }

        async function loadEnvironments() {
            try {
                environments = await deploymentService.getEnvironments();
                renderEnvironments();
            } catch (error) {
                console.error('Failed to load environments:', error);
            }
        }

        async function loadRecentDeployments() {
            try {
                recentDeployments = await deploymentService.getExecutions();
                renderRecentDeployments();
            } catch (error) {
                console.error('Failed to load recent deployments:', error);
            }
        }

        async function loadMetrics() {
            try {
                currentMetrics = await deploymentService.getDeploymentMetrics();
                renderMetrics();
            } catch (error) {
                console.error('Failed to load metrics:', error);
            }
        }

        function renderEnvironments() {
            const container = document.getElementById('environmentList');
            
            if (environments.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 20px;">No environments configured</p>';
                return;
            }

            container.innerHTML = environments.map(env => {
                const healthClass = env.healthScore >= 90 ? 'health-excellent' : 
                                  env.healthScore >= 75 ? 'health-good' : 
                                  env.healthScore >= 50 ? 'health-warning' : 'health-critical';
                
                return `
                    <div class="environment-item ${env.status}">
                        <div class="environment-info">
                            <h4>
                                <span class="health-indicator ${healthClass}"></span>
                                ${env.name}
                            </h4>
                            <p>Type: ${env.type.charAt(0).toUpperCase() + env.type.slice(1)}</p>
                            <p>Devices: ${env.devices.length}</p>
                            <p>Health Score: ${env.healthScore}%</p>
                            <p>Uptime: ${env.uptime.toFixed(2)}%</p>
                            <p>Last Deployment: ${env.lastDeployment ? new Date(env.lastDeployment).toLocaleDateString() : 'Never'}</p>
                        </div>
                        <div>
                            <div class="status-badge status-${env.status}">
                                ${env.status.toUpperCase()}
                            </div>
                            <button class="btn btn-success" onclick="deployToSpecificEnvironment('${env.id}')" style="margin-top: 10px; font-size: 12px; padding: 8px 12px;">
                                🚀 Deploy
                            </button>
                            <button class="btn btn-warning" onclick="viewEnvironmentDetails('${env.id}')" style="margin-top: 5px; font-size: 12px; padding: 8px 12px;">
                                📋 Details
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderRecentDeployments() {
            const container = document.getElementById('deploymentList');
            
            if (recentDeployments.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 20px;">No recent deployments</p>';
                return;
            }

            container.innerHTML = recentDeployments.slice(0, 10).map(deployment => {
                const environment = environments.find(env => env.id === deployment.environmentId);
                const duration = deployment.duration ? Math.round(deployment.duration / 1000) : 0;
                
                return `
                    <div class="deployment-item">
                        <div>
                            <h5>${environment?.name || 'Unknown Environment'}</h5>
                            <p>Status: ${deployment.status} | Duration: ${duration}s</p>
                            <p>Started: ${new Date(deployment.startedAt).toLocaleString()}</p>
                            <p>Triggered by: ${deployment.triggeredBy}</p>
                        </div>
                        <div class="status-badge status-${deployment.status === 'success' ? 'active' : deployment.status === 'failed' ? 'error' : 'maintenance'}">
                            ${deployment.status.toUpperCase()}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMetrics() {
            const container = document.getElementById('metricsGrid');
            
            container.innerHTML = `
                <div class="metric-item">
                    <span class="metric-value">${currentMetrics.totalDeployments || 0}</span>
                    <div class="metric-label">Total Deployments</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${Math.round(currentMetrics.successRate || 0)}%</span>
                    <div class="metric-label">Success Rate</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${Math.round(currentMetrics.averageDeploymentTime || 0)}s</span>
                    <div class="metric-label">Avg Duration</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${currentMetrics.deploymentFrequency?.toFixed(1) || 0}</span>
                    <div class="metric-label">Deployments/Day</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${currentMetrics.mttr || 0}m</span>
                    <div class="metric-label">MTTR</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${currentMetrics.leadTime || 0}m</span>
                    <div class="metric-label">Lead Time</div>
                </div>
            `;
        }

        async function createEnvironment() {
            const name = prompt('Enter environment name:');
            if (!name) return;

            const type = prompt('Enter environment type (development/staging/production/testing):');
            if (!type || !['development', 'staging', 'production', 'testing'].includes(type)) {
                showError('Invalid environment type');
                return;
            }

            try {
                const environmentData = {
                    name: name,
                    type: type,
                    description: `${name} environment for ${type}`,
                    endpoints: [],
                    devices: [],
                    configuration: {
                        variables: {},
                        secrets: {},
                        features: [],
                        scaling: {
                            minInstances: 1,
                            maxInstances: 3,
                            targetCpuUtilization: 70,
                            targetMemoryUtilization: 80,
                            autoScale: true
                        },
                        monitoring: {
                            metrics: ['cpu', 'memory', 'response_time'],
                            alerts: [],
                            dashboards: ['overview'],
                            retention: 7
                        },
                        backup: {
                            enabled: true,
                            schedule: '0 2 * * *',
                            retention: 7,
                            storage: `s3://backups/${type}`,
                            encryption: true
                        }
                    },
                    status: 'active',
                    healthScore: 100,
                    uptime: 99.9
                };

                await deploymentService.createEnvironment(environmentData);
                showSuccess('Environment created successfully');
                await loadEnvironments();
            } catch (error) {
                console.error('Failed to create environment:', error);
                showError('Failed to create environment');
            }
        }

        async function deployToEnvironment() {
            if (environments.length === 0) {
                showError('No environments available for deployment');
                return;
            }

            const envNames = environments.map((env, i) => `${i}: ${env.name} (${env.type})`).join('\n');
            const selection = prompt(`Select environment for deployment:\n${envNames}\n\nEnter number:`);
            
            if (selection === null) return;
            
            const index = parseInt(selection);
            if (isNaN(index) || index < 0 || index >= environments.length) {
                showError('Invalid selection');
                return;
            }

            await deployToSpecificEnvironment(environments[index].id);
        }

        async function deployToSpecificEnvironment(environmentId) {
            try {
                const pipelines = await deploymentService.getPipelines();
                if (pipelines.length === 0) {
                    showError('No deployment pipelines configured');
                    return;
                }

                const execution = await deploymentService.executePipeline(pipelines[0].id, environmentId, 'manual');
                showSuccess(`Deployment started successfully. Execution ID: ${execution.id}`);
                
                // Show active pipeline
                showActivePipeline(execution);
                
                // Refresh dashboard after delay
                setTimeout(() => loadDashboard(), 3000);
            } catch (error) {
                console.error('Failed to start deployment:', error);
                showError('Failed to start deployment');
            }
        }

        function showActivePipeline(execution) {
            const container = document.getElementById('activePipeline');
            const environment = environments.find(env => env.id === execution.environmentId);
            
            container.innerHTML = `
                <h4>Deploying to ${environment?.name || 'Unknown Environment'}</h4>
                <p>Status: ${execution.status}</p>
                <p>Started: ${new Date(execution.startedAt).toLocaleString()}</p>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${execution.status === 'running' ? '50' : execution.status === 'success' ? '100' : '0'}%"></div>
                </div>
                <div class="pipeline-stages">
                    ${execution.stages.map(stage => `
                        <div class="stage-item ${stage.status}">
                            <strong>Stage:</strong> ${stage.stageId}
                            <br><strong>Status:</strong> ${stage.status}
                            ${stage.duration ? `<br><strong>Duration:</strong> ${Math.round(stage.duration / 1000)}s` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function viewEnvironmentDetails(environmentId) {
            const environment = environments.find(env => env.id === environmentId);
            if (environment) {
                const endpoints = environment.endpoints.map(ep => `- ${ep.name}: ${ep.url} (${ep.type})`).join('\n');
                const features = environment.configuration.features.map(f => `- ${f.name}: ${f.enabled ? 'Enabled' : 'Disabled'}`).join('\n');
                
                showInfo(`Environment Details: ${environment.name}\n\nType: ${environment.type}\nStatus: ${environment.status}\nHealth Score: ${environment.healthScore}%\nUptime: ${environment.uptime.toFixed(2)}%\nDevices: ${environment.devices.length}\n\nEndpoints:\n${endpoints || 'None configured'}\n\nFeature Flags:\n${features || 'None configured'}\n\nScaling:\n- Min Instances: ${environment.configuration.scaling.minInstances}\n- Max Instances: ${environment.configuration.scaling.maxInstances}\n- Auto Scale: ${environment.configuration.scaling.autoScale ? 'Enabled' : 'Disabled'}\n\nBackup:\n- Enabled: ${environment.configuration.backup.enabled ? 'Yes' : 'No'}\n- Schedule: ${environment.configuration.backup.schedule}\n- Retention: ${environment.configuration.backup.retention} days`);
            }
        }

        async function rollbackDeployment() {
            if (recentDeployments.length === 0) {
                showError('No deployments available for rollback');
                return;
            }

            const rollbackableDeployments = recentDeployments.filter(d => d.rollbackable);
            if (rollbackableDeployments.length === 0) {
                showError('No rollbackable deployments found');
                return;
            }

            const deploymentList = rollbackableDeployments.map((d, i) => {
                const env = environments.find(e => e.id === d.environmentId);
                return `${i}: ${env?.name || 'Unknown'} - ${new Date(d.startedAt).toLocaleString()}`;
            }).join('\n');

            const selection = prompt(`Select deployment to rollback:\n${deploymentList}\n\nEnter number:`);
            
            if (selection === null) return;
            
            const index = parseInt(selection);
            if (isNaN(index) || index < 0 || index >= rollbackableDeployments.length) {
                showError('Invalid selection');
                return;
            }

            try {
                const success = await deploymentService.rollbackDeployment(rollbackableDeployments[index].id);
                if (success) {
                    showSuccess('Rollback initiated successfully');
                    setTimeout(() => loadDashboard(), 2000);
                } else {
                    showError('Failed to initiate rollback');
                }
            } catch (error) {
                console.error('Failed to rollback deployment:', error);
                showError('Failed to rollback deployment');
            }
        }

        function viewMetrics() {
            showInfo(`Deployment Metrics:\n\nTotal Deployments: ${currentMetrics.totalDeployments || 0}\nSuccessful: ${currentMetrics.successfulDeployments || 0}\nFailed: ${currentMetrics.failedDeployments || 0}\nSuccess Rate: ${Math.round(currentMetrics.successRate || 0)}%\n\nPerformance:\n- Average Duration: ${Math.round(currentMetrics.averageDeploymentTime || 0)} seconds\n- Deployment Frequency: ${currentMetrics.deploymentFrequency?.toFixed(1) || 0} per day\n- Lead Time: ${currentMetrics.leadTime || 0} minutes\n- MTTR: ${currentMetrics.mttr || 0} minutes\n- Change Failure Rate: ${currentMetrics.changeFailureRate?.toFixed(1) || 0}%`);
        }

        function startRealTimeUpdates() {
            setInterval(async () => {
                await loadRecentDeployments();
                await loadMetrics();
            }, 30000); // Update every 30 seconds
        }

        function showSuccess(message) {
            alert('✅ ' + message);
        }

        function showError(message) {
            alert('❌ ' + message);
        }

        function showInfo(message) {
            alert('ℹ️ ' + message);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeEnterpriseDeployment);
    </script>
</body>
</html>
