<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security & Compliance</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { 
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .header h1 { 
            color: #2c3e50; 
            margin-bottom: 10px;
            font-size: 2rem;
            font-weight: 700;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }
        .btn { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
        }
        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-success { 
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white; 
        }
        .btn-warning { 
            background: linear-gradient(135deg, #fdbb2d 0%, #22c1c3 100%);
            color: white; 
        }
        .btn-danger { 
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white; 
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card { 
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
        }
        .card:hover { 
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(31, 38, 135, 0.5);
        }
        .card h3 { 
            color: #2c3e50; 
            margin-bottom: 15px;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .scan-list { max-height: 400px; overflow-y: auto; }
        .scan-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }
        .scan-item:hover { background: rgba(255, 255, 255, 0.8); }
        .scan-item.completed { border-left-color: #4CAF50; }
        .scan-item.running { border-left-color: #2196F3; }
        .scan-item.failed { border-left-color: #f44336; }
        .scan-item.pending { border-left-color: #ff9800; }
        .scan-info h4 { 
            margin-bottom: 5px;
            color: #2c3e50;
            font-size: 1rem;
        }
        .scan-info p { 
            color: #7f8c8d;
            font-size: 0.9rem;
            margin: 2px 0;
        }
        .severity-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .severity-low { background: #e8f5e8; color: #2e7d32; }
        .severity-medium { background: #fff3e0; color: #f57c00; }
        .severity-high { background: #ffebee; color: #c62828; }
        .severity-critical { background: #ffebee; color: #b71c1c; font-weight: 700; }
        .vulnerability-list { max-height: 300px; overflow-y: auto; }
        .vulnerability-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-left: 4px solid transparent;
        }
        .vulnerability-item.critical { border-left-color: #b71c1c; }
        .vulnerability-item.high { border-left-color: #c62828; }
        .vulnerability-item.medium { border-left-color: #f57c00; }
        .vulnerability-item.low { border-left-color: #2e7d32; }
        .compliance-list { max-height: 300px; overflow-y: auto; }
        .compliance-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .compliance-score {
            font-size: 1.2rem;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
        }
        .score-excellent { background: #4CAF50; }
        .score-good { background: #8BC34A; }
        .score-fair { background: #FF9800; }
        .score-poor { background: #F44336; }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .metric-item {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .metric-item:hover { background: rgba(255, 255, 255, 0.5); }
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            display: block;
        }
        .metric-label {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 5px;
        }
        .audit-list { max-height: 300px; overflow-y: auto; }
        .audit-item {
            padding: 10px;
            margin-bottom: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }
        .audit-item.success { border-left-color: #4CAF50; }
        .audit-item.failure { border-left-color: #f44336; }
        .audit-item.info { border-left-color: #2196F3; }
        .audit-item.warning { border-left-color: #ff9800; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        .close:hover { color: #333; }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 Security & Compliance</h1>
            <p>Security scanning, audit trails, and compliance frameworks</p>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="startSecurityScan()">
                🔍 Start Scan
            </button>
            <button class="btn btn-success" onclick="runComplianceCheck()">
                ✅ Compliance Check
            </button>
            <button class="btn btn-warning" onclick="viewAuditLogs()">
                📋 Audit Logs
            </button>
            <button class="btn btn-danger" onclick="viewDashboard()">
                📊 Security Dashboard
            </button>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>🔍 Security Scans</h3>
                <div class="scan-list" id="scanList">
                    <!-- Scans will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>⚠️ Vulnerabilities</h3>
                <div class="vulnerability-list" id="vulnerabilityList">
                    <!-- Vulnerabilities will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>✅ Compliance Status</h3>
                <div class="compliance-list" id="complianceList">
                    <!-- Compliance results will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>📊 Security Metrics</h3>
                <div class="metrics-grid" id="metricsGrid">
                    <!-- Metrics will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>📋 Recent Audit Events</h3>
                <div class="audit-list" id="auditList">
                    <!-- Audit logs will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h3>🛡️ Security Policies</h3>
                <div id="policyList">
                    <!-- Security policies will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scan Configuration Modal -->
    <div id="scanModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('scanModal')">&times;</span>
            <h3>Configure Security Scan</h3>
            <div class="form-group">
                <label>Target Type:</label>
                <select id="targetType">
                    <option value="application">Application</option>
                    <option value="device">Device</option>
                    <option value="network">Network</option>
                    <option value="api">API</option>
                    <option value="infrastructure">Infrastructure</option>
                </select>
            </div>
            <div class="form-group">
                <label>Scan Type:</label>
                <select id="scanType">
                    <option value="vulnerability">Vulnerability Scan</option>
                    <option value="penetration">Penetration Test</option>
                    <option value="compliance">Compliance Check</option>
                    <option value="configuration">Configuration Audit</option>
                    <option value="dependency">Dependency Scan</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="submitScan()">Start Scan</button>
        </div>
    </div>

    <script>
        let securityService;
        let scans = [];
        let vulnerabilities = [];
        let complianceResults = [];
        let auditLogs = [];
        let securityPolicies = [];
        let dashboardData = {};

        async function initializeSecurityCompliance() {
            try {
                if (window.parent && window.parent.signageDebugServices) {
                    securityService = window.parent.signageDebugServices.securityCompliance;
                    await loadDashboard();
                    startRealTimeUpdates();
                } else {
                    showError('Security & Compliance service not available');
                }
            } catch (error) {
                console.error('Failed to initialize security compliance:', error);
                showError('Failed to initialize security compliance');
            }
        }

        async function loadDashboard() {
            await Promise.all([
                loadScans(),
                loadVulnerabilities(),
                loadComplianceResults(),
                loadAuditLogs(),
                loadSecurityPolicies(),
                loadDashboardData()
            ]);
        }

        async function loadScans() {
            try {
                scans = await securityService.getScans();
                renderScans();
            } catch (error) {
                console.error('Failed to load scans:', error);
            }
        }

        async function loadVulnerabilities() {
            try {
                // Extract vulnerabilities from recent scans
                vulnerabilities = scans.flatMap(scan => scan.results.vulnerabilities || [])
                    .sort((a, b) => {
                        const severityOrder = { critical: 4, high: 3, medium: 2, low: 1 };
                        return severityOrder[b.severity] - severityOrder[a.severity];
                    })
                    .slice(0, 10);
                renderVulnerabilities();
            } catch (error) {
                console.error('Failed to load vulnerabilities:', error);
            }
        }

        async function loadComplianceResults() {
            try {
                const frameworks = await securityService.getComplianceFrameworks();
                complianceResults = [];
                
                for (const framework of frameworks.slice(0, 3)) {
                    try {
                        const result = await securityService.runComplianceAssessment(framework.id);
                        complianceResults.push(result);
                    } catch (error) {
                        console.error(`Failed to assess ${framework.name}:`, error);
                    }
                }
                renderComplianceResults();
            } catch (error) {
                console.error('Failed to load compliance results:', error);
            }
        }

        async function loadAuditLogs() {
            try {
                auditLogs = await securityService.getAuditLogs({}, 20);
                renderAuditLogs();
            } catch (error) {
                console.error('Failed to load audit logs:', error);
            }
        }

        async function loadSecurityPolicies() {
            try {
                securityPolicies = await securityService.getSecurityPolicies();
                renderSecurityPolicies();
            } catch (error) {
                console.error('Failed to load security policies:', error);
            }
        }

        async function loadDashboardData() {
            try {
                dashboardData = await securityService.getSecurityDashboard();
                renderMetrics();
            } catch (error) {
                console.error('Failed to load dashboard data:', error);
            }
        }

        function renderScans() {
            const container = document.getElementById('scanList');
            
            if (scans.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 20px;">No security scans performed</p>';
                return;
            }

            container.innerHTML = scans.slice(0, 10).map(scan => `
                <div class="scan-item ${scan.status}">
                    <div class="scan-info">
                        <h4>${scan.scanType.charAt(0).toUpperCase() + scan.scanType.slice(1)} Scan</h4>
                        <p>Target: ${scan.targetType} (${scan.targetId})</p>
                        <p>Status: ${scan.status}</p>
                        <p>Started: ${new Date(scan.startedAt).toLocaleString()}</p>
                        ${scan.completedAt ? `<p>Duration: ${Math.round((new Date(scan.completedAt).getTime() - new Date(scan.startedAt).getTime()) / 1000)}s</p>` : ''}
                        <p>Issues: ${scan.results.summary.totalIssues || 0}</p>
                    </div>
                    <div>
                        <div class="severity-badge severity-${scan.severity}">
                            ${scan.severity.toUpperCase()}
                        </div>
                        <button class="btn btn-warning" onclick="viewScanDetails('${scan.id}')" style="margin-top: 10px; font-size: 12px; padding: 8px 12px;">
                            📋 Details
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderVulnerabilities() {
            const container = document.getElementById('vulnerabilityList');
            
            if (vulnerabilities.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 20px;">No vulnerabilities detected</p>';
                return;
            }

            container.innerHTML = vulnerabilities.map(vuln => `
                <div class="vulnerability-item ${vuln.severity}">
                    <h5>${vuln.title}</h5>
                    <p><strong>Severity:</strong> ${vuln.severity.toUpperCase()}</p>
                    <p><strong>CVSS Score:</strong> ${vuln.cvssScore}</p>
                    ${vuln.cve ? `<p><strong>CVE:</strong> ${vuln.cve}</p>` : ''}
                    <p><strong>Location:</strong> ${vuln.location.path}</p>
                    <p><strong>Status:</strong> ${vuln.status}</p>
                    <p style="margin-top: 8px; font-size: 0.85rem;">${vuln.description}</p>
                </div>
            `).join('');
        }

        function renderComplianceResults() {
            const container = document.getElementById('complianceList');
            
            if (complianceResults.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 20px;">No compliance assessments available</p>';
                return;
            }

            container.innerHTML = complianceResults.map(result => {
                const scoreClass = result.overallScore >= 90 ? 'excellent' : 
                                 result.overallScore >= 75 ? 'good' : 
                                 result.overallScore >= 50 ? 'fair' : 'poor';
                
                return `
                    <div class="compliance-item">
                        <div>
                            <h5>${result.framework} ${result.version}</h5>
                            <p>Status: ${result.status}</p>
                            <p>Controls: ${result.controls.length}</p>
                            <p>Last Assessment: ${new Date(result.lastAssessment).toLocaleDateString()}</p>
                        </div>
                        <div class="compliance-score score-${scoreClass}">
                            ${result.overallScore}%
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMetrics() {
            const container = document.getElementById('metricsGrid');
            const overview = dashboardData.overview || {};
            
            container.innerHTML = `
                <div class="metric-item">
                    <span class="metric-value">${overview.totalScans || 0}</span>
                    <div class="metric-label">Total Scans</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${overview.totalVulnerabilities || 0}</span>
                    <div class="metric-label">Vulnerabilities</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${overview.criticalVulnerabilities || 0}</span>
                    <div class="metric-label">Critical Issues</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${Math.round(overview.averageRiskScore || 0)}</span>
                    <div class="metric-label">Risk Score</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${Math.round(overview.complianceScore || 0)}%</span>
                    <div class="metric-label">Compliance</div>
                </div>
                <div class="metric-item">
                    <span class="metric-value">${overview.recentScans || 0}</span>
                    <div class="metric-label">Recent Scans</div>
                </div>
            `;
        }

        function renderAuditLogs() {
            const container = document.getElementById('auditList');
            
            if (auditLogs.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 20px;">No audit logs available</p>';
                return;
            }

            container.innerHTML = auditLogs.map(log => `
                <div class="audit-item ${log.outcome}">
                    <strong>${log.action}</strong> by ${log.user}<br>
                    Resource: ${log.resource}<br>
                    <em>${new Date(log.timestamp).toLocaleString()}</em>
                </div>
            `).join('');
        }

        function renderSecurityPolicies() {
            const container = document.getElementById('policyList');
            
            if (securityPolicies.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #7f8c8d; padding: 20px;">No security policies configured</p>';
                return;
            }

            container.innerHTML = securityPolicies.slice(0, 3).map(policy => `
                <div style="padding: 12px; margin-bottom: 8px; border-radius: 8px; background: rgba(255, 255, 255, 0.3);">
                    <h5>${policy.name} v${policy.version}</h5>
                    <p>Category: ${policy.category.replace('_', ' ').toUpperCase()}</p>
                    <p>Status: ${policy.status.toUpperCase()}</p>
                    <p>Controls: ${policy.controls.length}</p>
                    <p>Review Date: ${new Date(policy.reviewDate).toLocaleDateString()}</p>
                </div>
            `).join('');
        }

        function startSecurityScan() {
            document.getElementById('scanModal').style.display = 'block';
        }

        async function submitScan() {
            try {
                const targetType = document.getElementById('targetType').value;
                const scanType = document.getElementById('scanType').value;
                
                const scan = await securityService.startSecurityScan(
                    targetType,
                    'target_001',
                    scanType,
                    'admin'
                );
                
                closeModal('scanModal');
                showSuccess(`Security scan started. Scan ID: ${scan.id}`);
                
                // Refresh dashboard after delay
                setTimeout(() => loadDashboard(), 3000);
            } catch (error) {
                console.error('Failed to start scan:', error);
                showError('Failed to start security scan');
            }
        }

        async function runComplianceCheck() {
            try {
                const frameworks = await securityService.getComplianceFrameworks();
                if (frameworks.length === 0) {
                    showError('No compliance frameworks configured');
                    return;
                }

                const frameworkNames = frameworks.map((f, i) => `${i}: ${f.name} ${f.version}`).join('\n');
                const selection = prompt(`Select compliance framework:\n${frameworkNames}\n\nEnter number:`);
                
                if (selection === null) return;
                
                const index = parseInt(selection);
                if (isNaN(index) || index < 0 || index >= frameworks.length) {
                    showError('Invalid selection');
                    return;
                }

                showInfo('Running compliance assessment... This may take a few moments.');
                
                const result = await securityService.runComplianceAssessment(frameworks[index].id);
                showSuccess(`Compliance assessment completed. Score: ${result.overallScore}% (${result.status})`);
                
                await loadComplianceResults();
            } catch (error) {
                console.error('Failed to run compliance check:', error);
                showError('Failed to run compliance check');
            }
        }

        function viewAuditLogs() {
            const recentLogs = auditLogs.slice(0, 10);
            const logSummary = recentLogs.map(log => 
                `${new Date(log.timestamp).toLocaleString()} - ${log.user} ${log.action} ${log.resource} (${log.outcome})`
            ).join('\n');
            
            showInfo(`Recent Audit Events:\n\n${logSummary || 'No recent audit events'}`);
        }

        function viewDashboard() {
            const overview = dashboardData.overview || {};
            const topRisks = dashboardData.topRisks || [];
            
            showInfo(`Security Dashboard Overview:\n\nScans: ${overview.totalScans || 0}\nVulnerabilities: ${overview.totalVulnerabilities || 0}\nCritical Issues: ${overview.criticalVulnerabilities || 0}\nRisk Score: ${Math.round(overview.averageRiskScore || 0)}/100\nCompliance Score: ${Math.round(overview.complianceScore || 0)}%\n\nTop Risks:\n${topRisks.slice(0, 3).map(risk => `- ${risk.title} (${risk.severity})`).join('\n') || 'None identified'}`);
        }

        function viewScanDetails(scanId) {
            const scan = scans.find(s => s.id === scanId);
            if (!scan) {
                showError('Scan not found');
                return;
            }

            const summary = scan.results.summary;
            const vulnerabilities = scan.results.vulnerabilities || [];
            const topVulns = vulnerabilities.slice(0, 3);
            
            showInfo(`Scan Details: ${scan.scanType}\n\nTarget: ${scan.targetType} (${scan.targetId})\nStatus: ${scan.status}\nSeverity: ${scan.severity}\nStarted: ${new Date(scan.startedAt).toLocaleString()}\n${scan.completedAt ? `Completed: ${new Date(scan.completedAt).toLocaleString()}` : ''}\n\nSummary:\n- Total Issues: ${summary.totalIssues}\n- Critical: ${summary.criticalIssues}\n- High: ${summary.highIssues}\n- Medium: ${summary.mediumIssues}\n- Low: ${summary.lowIssues}\n- Risk Score: ${summary.riskScore}/100\n- Security Score: ${summary.securityScore}/100\n\nTop Vulnerabilities:\n${topVulns.map(v => `- ${v.title} (${v.severity})`).join('\n') || 'None found'}`);
        }

        function startRealTimeUpdates() {
            setInterval(async () => {
                await loadAuditLogs();
                await loadDashboardData();
            }, 30000); // Update every 30 seconds
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function showSuccess(message) {
            alert('✅ ' + message);
        }

        function showError(message) {
            alert('❌ ' + message);
        }

        function showInfo(message) {
            alert('ℹ️ ' + message);
        }

        // Close modals when clicking outside
        window.onclick = function(event) {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeSecurityCompliance);
    </script>
</body>
</html>
