<!DOCTYPE html>
<html>
<head>
  <title>Signage Debug Panel</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; background-color: #282c34; color: #abb2bf; }
    .controls { margin-bottom: 10px; display: flex; gap: 10px; }
    .controls input, .controls select { padding: 5px; border-radius: 4px; border: 1px solid #3e4451; background-color: #3e4451; color: #abb2bf; }
    .log-container { border: 1px solid #3e4451; background-color: #21252b; height: calc(100vh - 100px); overflow-y: auto; padding: 5px; border-radius: 4px; }
    .log-entry { padding: 3px 0; border-bottom: 1px dashed #3e4451; display: flex; gap: 10px; }
    .log-entry:last-child { border-bottom: none; }
    .log-entry .timestamp { color: #61afef; min-width: 100px; }
    .log-entry .level { font-weight: bold; text-transform: uppercase; min-width: 40px; text-align: center; }
    .log-entry .tag { color: #98c379; min-width: 80px; }
    .log-entry .message { flex-grow: 1; word-break: break-all; }

    /* Log Levels */
    .level-error { color: #e06c75; }
    .level-warn { color: #e5c07b; }
    .level-info { color: #56b6c2; }
    .level-debug { color: #c678dd; }
    .level-verbose { color: #abb2bf; }

    /* Highlighted events */
    .highlight-init { background-color: rgba(86, 182, 194, 0.2); } /* info */
    .highlight-loadmedia { background-color: rgba(152, 195, 121, 0.2); } /* success */
    .highlight-error { background-color: rgba(224, 108, 117, 0.2); } /* error */
  </style>
</head>
<body>
  <div class="controls">
    <input type="text" id="tagFilter" placeholder="Filter by Tag (comma-separated)">
    <select id="levelFilter">
      <option value="">All Levels</option>
      <option value="error">Error</option>
      <option value="warn">Warn</option>
      <option value="info">Info</option>
      <option value="debug">Debug</option>
      <option value="verbose">Verbose</option>
    </select>
    <input type="text" id="messageFilter" placeholder="Filter by Message (regex)">
    <button id="clearLogs" style="background-color: #e06c75; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Clear Logs</button>
  </div>
  <div class="log-container" id="logContainer">
    <!-- Log entries will be appended here -->
  </div>

  <script src="panel.js"></script>
</body>
</html>
