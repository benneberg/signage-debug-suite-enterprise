<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Signage Logcat Viewer</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; background-color: #282c34; color: #abb2bf; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .controls { margin-bottom: 10px; display: flex; gap: 10px; }
        .controls input, .controls select, .controls button { padding: 5px; border-radius: 4px; border: 1px solid #3e4451; background-color: #3e4451; color: #abb2bf; }
        .log-output { flex-grow: 1; border: 1px solid #3e4451; background-color: #21252b; overflow-y: auto; padding: 5px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; font-family: monospace; font-size: 0.9em; }

        /* Basic logcat colors (simplified) */
        .log-V { color: #abb2bf; } /* Verbose */
        .log-D { color: #c678dd; } /* Debug */
        .log-I { color: #56b6c2; } /* Info */
        .log-W { color: #e5c07b; } /* Warn */
        .log-E { color: #e06c75; } /* Error */
        .log-F { color: #e06c75; font-weight: bold; } /* Fatal */
    </style>
</head>
<body>
    <div class="controls">
        <button id="startLogcat">Start Logcat</button>
        <button id="stopLogcat">Stop Logcat</button>
        <input type="text" id="tagFilter" placeholder="Filter by Tag (comma-separated)">
        <select id="levelFilter">
            <option value="">All Levels</option>
            <option value="V">Verbose</option>
            <option value="D">Debug</option>
            <option value="I">Info</option>
            <option value="W">Warn</option>
            <option value="E">Error</option>
            <option value="F">Fatal</option>
        </select>
        <input type="text" id="messageFilter" placeholder="Filter by Message (regex)">
        <button id="clearLogs">Clear Logs</button>
    </div>
    <div id="logOutput" class="log-output"></div>

    <script src="renderer.js"></script>
</body>
</html>
